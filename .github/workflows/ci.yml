name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PII_MODEL_DIR: ${{ github.workspace }}/.stanza_resources
      STANZA_RESOURCES_DIR: ${{ github.workspace }}/.stanza_resources
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ml.txt
            requirements-torch-cpu.txt
      - name: Install document processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto ghostscript libreoffice-writer tesseract-ocr tesseract-ocr-eng tesseract-ocr-kaz tesseract-ocr-osd tesseract-ocr-rus
      - name: Install Python dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-torch-cpu.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Cache local privacy models
        id: models
        uses: actions/cache@v4
        with:
          path: .stanza_resources
          key: stanza-${{ runner.os }}-${{ hashFiles('requirements-ml.txt', 'requirements-torch-cpu.txt') }}-kk-ru-en-v1
      - name: Download local privacy models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -c "import os, stanza; [stanza.download(lang, model_dir=os.environ['PII_MODEL_DIR'], processors='tokenize,ner', verbose=False) for lang in ('kk', 'ru', 'en')]"
      - name: Run all backend tests
run: |
  mkdir -p test-results
  python -m pytest -q --junitxml=test-results/backend.xml
      - name: Save backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run all frontend unit tests
        run: npm test
      - name: Check types and build
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run existing browser tests
        run: npm run test:e2e -- --workers=2 --forbid-only
      - name: Save browser failure traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            artifacts/ui-review/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Require every test job to succeed
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$E2E_RESULT" = success
