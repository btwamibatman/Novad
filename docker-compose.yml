services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-document_api_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-document_api_password}
      POSTGRES_DB: ${POSTGRES_DB:-document_api}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Document Processing API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://document_api_user:document_api_password@db:5432/document_api}
      STORAGE_DIR: ${STORAGE_DIR:-storage/uploads}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus+kaz+eng}
      OCR_MIN_TEXT_SIGNAL_CHARS: ${OCR_MIN_TEXT_SIGNAL_CHARS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
