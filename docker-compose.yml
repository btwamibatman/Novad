x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-document_api_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-document_api_password}
      POSTGRES_DB: ${POSTGRES_DB:-document_api}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    image: practice-task-tracker-api-app:local
    build:
      context: .
    env_file:
      - .env
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Document Processing API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://document_api_user:document_api_password@db:5432/document_api}
      STORAGE_DIR: ${STORAGE_DIR:-storage/uploads}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
      MAX_REQUEST_SIZE_BYTES: ${MAX_REQUEST_SIZE_BYTES:-57671680}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-100}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-document_session}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-120}
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-900}
      SESSION_STORAGE_QUOTA_BYTES: ${SESSION_STORAGE_QUOTA_BYTES:-524288000}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-45}
      CONTENT_REVIEW_QUICK_MAX_CHARS: ${CONTENT_REVIEW_QUICK_MAX_CHARS:-50000}
      CONTENT_REVIEW_BATCH_MAX_CHARS: ${CONTENT_REVIEW_BATCH_MAX_CHARS:-10000}
      CONTENT_REVIEW_THOROUGH_MAX_BATCHES: ${CONTENT_REVIEW_THOROUGH_MAX_BATCHES:-6}
      CONTENT_REVIEW_MAX_OUTPUT_TOKENS: ${CONTENT_REVIEW_MAX_OUTPUT_TOKENS:-1800}
      LAYOUT_REVIEW_MAX_PAGES: ${LAYOUT_REVIEW_MAX_PAGES:-3}
      LAYOUT_REVIEW_DPI: ${LAYOUT_REVIEW_DPI:-150}
      LAYOUT_REVIEW_MIN_DPI: ${LAYOUT_REVIEW_MIN_DPI:-72}
      LAYOUT_REVIEW_MAX_OUTPUT_TOKENS: ${LAYOUT_REVIEW_MAX_OUTPUT_TOKENS:-1000}
      LAYOUT_REVIEW_MAX_PIXELS_PER_PAGE: ${LAYOUT_REVIEW_MAX_PIXELS_PER_PAGE:-8000000}
      LAYOUT_REVIEW_MAX_INLINE_BYTES: ${LAYOUT_REVIEW_MAX_INLINE_BYTES:-12582912}
      AI_CHAT_TIMEOUT_SECONDS: ${AI_CHAT_TIMEOUT_SECONDS:-20}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus+kaz+eng}
      OCR_MIN_TEXT_SIGNAL_CHARS: ${OCR_MIN_TEXT_SIGNAL_CHARS:-30}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-300}
      OCR_MIN_RENDER_DPI: ${OCR_MIN_RENDER_DPI:-180}
      OCR_MAX_PIXELS_PER_PAGE: ${OCR_MAX_PIXELS_PER_PAGE:-20000000}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-45}
      PII_MASKING_ENABLED: ${PII_MASKING_ENABLED:-true}
      PII_NER_LANGUAGES: ${PII_NER_LANGUAGES:-kk,ru,en}
      PII_MODEL_DIR: ${PII_MODEL_DIR:-/opt/stanza_resources}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    logging: *default-logging

  analysis-worker:
    image: practice-task-tracker-api-app:local
    command: ["python", "-m", "app.analysis_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://document_api_user:document_api_password@db:5432/document_api}
      STORAGE_DIR: ${STORAGE_DIR:-storage/uploads}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus+kaz+eng}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-300}
      OCR_MIN_RENDER_DPI: ${OCR_MIN_RENDER_DPI:-180}
      OCR_MAX_PIXELS_PER_PAGE: ${OCR_MAX_PIXELS_PER_PAGE:-20000000}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-45}
      ANALYSIS_WORKER_POLL_SECONDS: ${ANALYSIS_WORKER_POLL_SECONDS:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    logging: *default-logging

volumes:
  postgres_data:
